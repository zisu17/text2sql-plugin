- id: 8
  question: 지역별 매출과 주문 수를 같이 보여줘
  type: 복합
  path: metric
  sql: |
    SELECT customer_state, r.revenue, n.order_count
    FROM (SELECT DISTINCT customer_state FROM customers) s
    LEFT JOIN (SELECT c.customer_state, SUM(i.price) AS revenue
               FROM order_items i JOIN orders o USING (order_id) JOIN customers c USING (customer_id)
               WHERE o.order_status NOT IN ('canceled', 'unavailable') GROUP BY 1) r USING (customer_state)
    LEFT JOIN (SELECT c.customer_state, COUNT(*) AS order_count
               FROM orders o JOIN customers c USING (customer_id)
               WHERE o.order_status NOT IN ('canceled', 'unavailable') GROUP BY 1) n USING (customer_state)
    WHERE r.revenue IS NOT NULL OR n.order_count IS NOT NULL
    ORDER BY 1
  answer: [["RJ", 30, 1], ["SP", 170, 2]]
  call: {metrics: [revenue, orders.order_count], dimensions: [customers.customer_state]}
  note: 매출과 주문 수는 기준 테이블이 달라 엔진이 따로 집계해 합친다

- id: 9
  question: 주문 1건당 평균 매출은 얼마야?
  type: 계산
  path: metric
  sql: |
    SELECT (SELECT SUM(i.price) FROM order_items i JOIN orders o USING (order_id)
            WHERE o.order_status NOT IN ('canceled', 'unavailable'))
         / (SELECT COUNT(*) FROM orders WHERE order_status NOT IN ('canceled', 'unavailable'))
  answer: [[66.67]]
  call: {metrics: [revenue, orders.order_count]}
  expr: revenue / order_count
  note: 매출 200 / 주문 3건. LLM이 두 지표를 고르고 expr 로 나눈다(DERIVABLE). 반올림은 질문에 없어 gold 에서도 뺐다

