- id: 4
  question: 2018년 월별 매출 보여줘
  type: 추이
  path: metric
  sql: |
    SELECT strftime('%Y-%m-01', o.order_purchase_timestamp) AS m, SUM(i.price)
    FROM order_items i JOIN orders o USING (order_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
    GROUP BY m ORDER BY m
  answer: [["2018-01", 180], ["2018-02", 20]]
  call: {metrics: [revenue], dimensions: [orders.order_purchase_timestamp__month]}

