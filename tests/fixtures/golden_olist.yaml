# 엔진·가드 점검용 문항(골든셋). 질문마다 기대하는 길, 대조 SQL, 정답, 지표 호출값을 적는다.
# 대상 데이터: tests/conftest.py 의 FIXTURE_SQL (주문 4건, 2018년 1~2월, o3 은 취소)
# path: 기대하는 길. metric = 지표 정의(t2s compile), sql = 직접 쓴 SELECT(t2s run), refuse = 답하지 않음, any = 상관없음
# sql: 정답을 낸 대조 SQL(SQLite). answer: 그 결과. test_engine.py 가 둘이 같은지 확인한다
# call: 지표 질문이면 LLM 이 t2s compile 에 넘겨야 할 지표·조건. test_engine.py 가 이 값으로 엔진이 정답을 내는지 확인한다

- id: 1
  question: 2018년 1월 매출 얼마야?
  type: 집계
  path: metric
  sql: |
    SELECT SUM(i.price) FROM order_items i JOIN orders o USING (order_id)
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-02-01'
  answer: [[180]]
  call: {metrics: [revenue], where: ["orders.order_purchase_timestamp >= '2018-01-01'", "orders.order_purchase_timestamp < '2018-02-01'"]}

